const STOP = new Set("a an and are as at be by can do does for from has have how i in is it me my of on or so that the this to was what with you your worked work any ever done".split(" "));
const EXPAND = {
  llm: ["rag","retrieval","chatbot","llm","semantic"], llms: ["rag","retrieval","chatbot","llm"],

};
const tok = s => s.toLowerCase().replace(/[^a-z0-9\- ]+/g," ").split(/\s+/)
  .map(w => w.replace(/^-+|-+$/g,"")).filter(w => w && !STOP.has(w))
  .map(w => (w.length > 4 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0,-1) : w);

function buildIndex(docs){
  const df = {};
  const vecs = docs.map(d => {
    const words = tok([d.name, d.role || "", d.summary, (d.courses || []).map(c => c[0]).join(" "), (d.stack || d.tags || []).join(" "), d.keywords].join(" "));
    const tf = {};
    words.forEach(w => tf[w] = (tf[w] || 0) + 1);
    Object.keys(tf).forEach(w => df[w] = (df[w] || 0) + 1);
    return tf;
  });
  const N = docs.length;
  return query => {
    const base = tok(query);
    const terms = new Map();
    base.forEach(t => { terms.set(t, 1); (EXPAND[t] || []).forEach(x => tok(x).forEach(y => { if(!terms.has(y)) terms.set(y, .5); })); });
    return docs.map((d, i) => {
      let score = 0; const hits = [];
      terms.forEach((wt, t) => { const f = vecs[i][t]; if (f){ score += wt * (1 + Math.log(f)) * Math.log(1 + N / df[t]); hits.push(t); } });
      return { doc: d, score, hits };
    }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
  };
}

function highlight(text, hits){
  if (!hits.length) return text;
  const re = new RegExp("\\b(" + hits.map(h => h.replace(/[-]/g,"\\-")).join("|") + ")\\w*", "gi");
  const out = []; let last = 0, m;
  while ((m = re.exec(text))){ out.push(text.slice(last, m.index)); out.push(html`<mark key=${m.index}>${m[0]}</mark>`); last = m.index + m[0].length; }
  out.push(text.slice(last));
  return out;
}

  return html`
    <div class="ask" role="search">
      <h2>Ask what I've worked on</h2>
      <p class="note">Keyword retrieval over this page, running in your browser. Each answer cites where it came from.</p>
      <form class="ask-row" onSubmit=${e => { e.preventDefault(); setAsked(q); }}>
        <label for="askq" class="sr-only">Question</label>
        <input id="askq" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Have you built streaming pipelines?" autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
      <div class="chips">
        ${SUGGESTIONS.map(s => html`<button key=${s} class="chip" aria-pressed=${asked === s} onClick=${() => run(s)}>${s}</button>`)}
      </div>
      ${asked && (results.length ? html`
        <ol class="results" aria-live="polite">
          ${results.map(r => html`
            <li class="result" key=${r.doc.id}>
              <h3>${r.doc.name}</h3>
              <p>${highlight(r.doc.summary.length > 240 ? r.doc.summary.slice(0, 237) + "..." : r.doc.summary, r.hits)}</p>
              <span class="src">Source: ${r.doc.section} </span>
              <button onClick=${() => onJump(r.doc.id)}>Show in page</button>
            </li>`)}
        </ol>` : html`<p class="empty" aria-live="polite">Nothing on this page matches "${asked}". Try a tool name like Kafka or Pinecone, or email me and ask directly.</p>`)}
    </div>`;
}

function Nav({ theme, setTheme }){
  return html`
    <header class="nav"><div class="wrap">
      <a class="mono" href="#top">Aymen Baig</a>
      <ul>
        <li><a href="#work">Work</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="theme-btn" onClick=${() => setTheme(theme === "dark" ? "light" : "dark")} aria-label="Switch color theme">
        ${theme === "dark" ? "Light mode" : "Dark mode"}
      </button>
    </div></header>`;
}

function Projects(){
  const [area, setArea] = useState("All");
  const areas = ["All", "AI", "Data", "Full-stack"];
  const shown = PROJECTS.filter(p => area === "All" || p.area === area);
  const featured = area === "All" ? shown.filter(p => p.featured) : [];
  const rest = area === "All" ? shown.filter(p => !p.featured) : shown;
  return html`
    <section class="block" id="projects"><div class="wrap">
      <h2>Projects</h2>
      <div class="filters" role="group" aria-label="Filter projects">
        ${areas.map(a => html`<button key=${a} aria-pressed=${area === a} onClick=${() => setArea(a)}>${a}</button>`)}
      </div>
      ${featured.length > 0 && html`
        <div class="featured">
          ${featured.map(p => html`
            <article class="feat" id=${p.id} key=${p.id}>
              <h3><a href=${p.link} target="_blank" rel="noopener">${p.name}</a>${p.status && html`<span class="status">${p.status}</span>`}</h3>
              <p>${p.summary}</p>
              <div class="stack">${p.stack.join(", ")}</div>
            </article>`)}
        </div>`}
      <ul class="plist">
        ${rest.map(p => html`
          <li id=${p.id} key=${p.id}>
            <h3><a href=${p.link} target="_blank" rel="noopener">${p.name}</a>${p.status && html`<span class="status">${p.status}</span>`}</h3>
            <p>${p.summary}</p>
            <div class="stack">${p.stack.join(", ")}</div>
          </li>`)}
      </ul>
    </div></section>`;
}

function App(){
  const [theme, setTheme] = useState(() => {
    try { const t = localStorage.getItem("theme"); if (t) return t; } catch(e) {}
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch(e) {}
  }, [theme]);

  return html`
    <${Nav} theme=${theme} setTheme=${setTheme} />
    <main id="top">
      <div class="wrap hero">
        <div>
          <h1>Aymen<br/>Baig</h1>
          <p class="lede">${PROFILE.lede}</p>
          <p class="meta">${PROFILE.meta}</p>
          <div class="links">
            <a class="btn primary" href=${"mailto:" + PROFILE.email}>Email me</a>
            <a class="btn" href=${PROFILE.github} target="_blank" rel="noopener">GitHub</a>
            <a class="btn" href=${PROFILE.linkedin} target="_blank" rel="noopener">LinkedIn</a>
            <a class="btn" href=${PROFILE.devpost} target="_blank" rel="noopener">Devpost</a>
          </div>
        </div>
        <${Ask} onJump=${jumpTo} />
      </div>

      <section class="block" id="work"><div class="wrap">
        <h2>Work</h2>
        <div class="timeline">
          ${WORK.map(w => html`
            <article class="job" id=${w.id} key=${w.id}>
              <div class="when">${w.when}</div>
              <div>
                <h3>${w.name}</h3>
                <p class="role">${w.role}</p>
                <ul class="points">${w.points.map(t => html`<li key=${t}>${t}</li>`)}</ul>
                ${w.courses && html`<ul class="courses">${w.courses.map(([c, d]) => html`<li key=${c}><span>${c}</span>${d && html`<span class="cdate">${d}</span>`}</li>`)}</ul>`}
                <div class="tags">${w.tags.join(", ")}</div>
              </div>
            </article>`)}
        </div>
      </div></section>

      <${Projects} />

      <section class="block" id="skills"><div class="wrap">
        <h2>Skills</h2>
        <dl class="skills">
          ${SKILLS.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}
        </dl>
      </div></section>

      <section class="block" id="certs"><div class="wrap two">
        <div>
          <h2 class="sub-h">Achievements</h2>
          <ul class="plist">
            ${ACHIEVEMENTS.map(x => html`<li class="award" id=${x.id} key=${x.id}><h3>${x.name}</h3><div class="stack">${x.detail}</div></li>`)}
          </ul>
        </div>
        <div>
          <h2 class="sub-h">Certifications</h2>
          <ul class="plist">
            ${CERTS.map(x => html`<li class="award" id=${x.id} key=${x.id}><h3>${x.name}</h3><div class="stack">${x.detail}</div></li>`)}
          </ul>
        </div>
      </div></section>

      <section class="block" id="contact"><div class="wrap two">
        <div>
          <h2 class="sub-h">Education</h2>
          <h3>BSc Data Science</h3>
          <p>PUCIT, University of the Punjab, Nov 2021 to Jun 2025. CGPA 3.74/4.0.</p>
          <h3>Intermediate, Pre-Engineering</h3>
          <p>Unique Group of Institutions, Jul 2019 to Jul 2021. 1083/1100 (98.5%).</p>
        </div>
        <div>
          <h2 class="sub-h">Contact</h2>
          <p>Have messy data and a question you want answered from it? Write to me.</p>
          <p><a class="contact-big" href=${"mailto:" + PROFILE.email}>${PROFILE.email}</a></p>
          <p><a href=${PROFILE.github} target="_blank" rel="noopener">GitHub</a>, <a href=${PROFILE.linkedin} target="_blank" rel="noopener">LinkedIn</a>, <a href=${PROFILE.hackerrank} target="_blank" rel="noopener">HackerRank</a>, <a href=${PROFILE.devpost} target="_blank" rel="noopener">Devpost</a></p>
        </div>
      </div></section>
    </main>
    <footer><div class="wrap">Built with React. Last updated ${new Date().getFullYear()}.</div></footer>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
